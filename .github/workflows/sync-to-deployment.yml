name: Sync Frontend to Deployment Repo

on:
  push:
    branches: [ main ]
    paths:
      - 'Fase 2/Evidencias Proyecto/Evidencias de sistema/APT/frontend/**'
  workflow_dispatch:

jobs:
  sync-to-deployment:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: monorepo

      - name: Checkout Frontend-Magnolias
        uses: actions/checkout@v4
        with:
          repository: SebitaxGod/Frontend-Magnolias
          token: ${{ secrets.FRONTEND_DEPLOY_TOKEN }}
          path: frontend-deployment

      - name: Sync frontend files to deployment repo
        run: |
          echo "🔄 Syncing frontend files to Frontend-Magnolias..."
          
          # Copiar archivos del frontend del monorepo al repo de deployment
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env.local' \
            --exclude='.env*.local' \
            "monorepo/Fase 2/Evidencias Proyecto/Evidencias de sistema/APT/frontend/" \
            frontend-deployment/
          
          echo "✅ Files synced successfully"

      - name: Commit and push to deployment repo
        working-directory: frontend-deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Verificar si hay cambios
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            
            # Obtener el último commit message del monorepo relacionado con frontend
            COMMIT_MSG=$(cd ../monorepo && git log -1 --pretty=%B -- "Fase 2/Evidencias Proyecto/Evidencias de sistema/APT/frontend")
            
            git commit -m "chore: sync from monorepo

${COMMIT_MSG}

Synced from monorepo commit: ${{ github.sha }}"
            
            git push origin main
            
            echo "✅ Changes pushed to Frontend-Magnolias"
            echo "🚀 Vercel will automatically deploy these changes"
          else
            echo "ℹ️ No changes to sync"
          fi

      - name: Create sync summary
        if: always()
        run: |
          echo "## 📦 Frontend Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** Capstone-Grupo3/2025_2_MA_CAPSTONE_708D_GRUPO_3" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** SebitaxGod/Frontend-Magnolias" >> $GITHUB_STEP_SUMMARY
          echo "**Path:** \`Fase 2/Evidencias Proyecto/Evidencias de sistema/APT/frontend/\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Vercel Deployment:** Changes will be automatically deployed" >> $GITHUB_STEP_SUMMARY
